[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-clin"
version = "0.1.0"
description = "Document-grounded clinical NLP search using BM25 and semantic embeddings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "groq>=0.12",
    "python-dotenv>=1.0",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "pydantic[email]>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
