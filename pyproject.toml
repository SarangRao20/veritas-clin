[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-clin"
version = "0.1.0"
description = "Evidence-grounded clinical information extraction with NLI verification and calibrated abstention."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.44",
    "accelerate>=0.34",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
    "matplotlib>=3.8",
    "pytest>=8.0",
    "numpy>=1.26",
    "nltk>=3.9",
    "spacy>=3.8",
    "python-crfsuite>=0.9.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
